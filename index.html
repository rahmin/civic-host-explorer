const u=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
async function open(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));}
async function go(pw,remember){const html=await open(pw);try{remember&&sessionStorage.setItem('chp',pw)}catch(e){}document.open();document.write(html);document.close();}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('b'),er=document.getElementById('err');
b.disabled=true;b.textContent='Opening…';er.textContent='';
try{await go(document.getElementById('pw').value.trim(),true)}catch(x){er.textContent='Wrong password.';b.disabled=false;b.textContent='Open'}};
try{const p=sessionStorage.getItem('chp');if(p)go(p,false).catch(()=>sessionStorage.removeItem('chp'))}catch(e){}
</script></body></html>
